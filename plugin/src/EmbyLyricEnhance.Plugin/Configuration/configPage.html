<div id="EmbyLyricEnhanceConfigPage"
     data-role="page"
     class="page type-interior pluginConfigurationPage"
     data-controller="__plugin/embylyricenhanceconfigjsv040"
     data-require="emby-input,emby-button,emby-select,emby-checkbox">
    <style>
        #EmbyLyricEnhanceConfigPage {
            min-height: 100%;
            background: transparent;
        }

        #EmbyLyricEnhanceConfigPage.elyric-managed-hidden {
            display: none !important;
        }

        #EmbyLyricEnhanceConfigPage .elyric-save-status {
            position: sticky;
            top: .75em;
            z-index: 2;
            margin: .75em 0 1.25em;
            padding: .85em 1em;
            border-left: .35em solid var(--theme-primary-color, #00a4dc);
            border-radius: .35em;
            background: rgba(0, 0, 0, .28);
            color: inherit;
            box-shadow: 0 .2em .8em rgba(0, 0, 0, .2);
        }

        #EmbyLyricEnhanceConfigPage .elyric-save-status[data-state="error"] {
            border-left-color: #ff8a80;
        }

        #EmbyLyricEnhanceConfigPage .elyric-save-status[hidden] {
            display: none;
        }

        #EmbyLyricEnhanceConfigPage .elyric-reload-button {
            margin-bottom: 1.25em;
        }
    </style>
    <div data-role="content">
        <div class="content-primary">
            <form id="EmbyLyricEnhanceConfigForm">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">歌词增强</h2>
                </div>

                <div class="fieldDescription">Emby Lyric Enhance 服务器显示设置</div>
                <div id="elyricSaveStatus"
                     class="elyric-save-status"
                     role="status"
                     aria-live="polite"
                     data-state="idle"
                     hidden></div>
                <button is="emby-button"
                        id="elyricReloadButton"
                        type="button"
                        class="raised emby-button elyric-reload-button">
                    <span>重新读取服务器设置</span>
                </button>

                <div class="selectContainer">
                    <label class="selectLabel" for="elyricDefaultTheme">服务器默认主题</label>
                    <select is="emby-select" id="elyricDefaultTheme" class="emby-select-withcolor emby-select">
                        <option value="classic">经典累积</option>
                        <option value="focus">单字聚焦</option>
                        <option value="gradient">渐变扫光</option>
                        <option value="apple">Apple 风格</option>
                        <option value="minimal">简洁整行</option>
                    </select>
                </div>

                <label class="checkboxContainer">
                    <input is="emby-checkbox" type="checkbox" id="elyricAllowUserThemeOverride" checked />
                    <span>允许浏览器保存并覆盖默认主题</span>
                </label>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="elyricFontSizePercent">字号（70–180%）</label>
                    <input is="emby-input" type="number" id="elyricFontSizePercent" min="70" max="180" step="1" value="100" required />
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="elyricLineHeight">行距（1.00–2.00）</label>
                    <input is="emby-input" type="number" id="elyricLineHeight" min="1" max="2" step="0.05" value="1.25" required />
                </div>

                <div class="selectContainer">
                    <label class="selectLabel" for="elyricFontWeight">字重</label>
                    <select is="emby-select" id="elyricFontWeight" class="emby-select-withcolor emby-select">
                        <option value="300">300</option>
                        <option value="400">400</option>
                        <option value="500">500</option>
                        <option value="600" selected>600</option>
                        <option value="700">700</option>
                        <option value="800">800</option>
                        <option value="900">900</option>
                    </select>
                </div>

                <label class="checkboxContainer">
                    <input is="emby-checkbox" type="checkbox" id="elyricUseThemeColor" checked />
                    <span>高亮颜色跟随 Emby 主题</span>
                </label>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="elyricHighlightColor">自定义高亮色（#RRGGBB）</label>
                    <input is="emby-input" type="text" id="elyricHighlightColor" maxlength="7" pattern="#[0-9A-Fa-f]{6}" placeholder="#ffffff" value="#ffffff" required />
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="elyricPendingOpacity">未唱字透明度（0.10–0.90）</label>
                    <input is="emby-input" type="number" id="elyricPendingOpacity" min="0.1" max="0.9" step="0.01" value="0.46" required />
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="elyricGlowStrength">辉光强度（0–1）</label>
                    <input is="emby-input" type="number" id="elyricGlowStrength" min="0" max="1" step="0.05" value="0.45" required />
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="elyricCurrentLineScale">当前行缩放（1.00–1.25）</label>
                    <input is="emby-input" type="number" id="elyricCurrentLineScale" min="1" max="1.25" step="0.01" value="1.08" required />
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="elyricOtherLinesOpacity">其他行透明度（0.10–1.00）</label>
                    <input is="emby-input" type="number" id="elyricOtherLinesOpacity" min="0.1" max="1" step="0.01" value="0.34" required />
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="elyricOtherLinesBlurPixels">其他行模糊（0–4 px）</label>
                    <input is="emby-input" type="number" id="elyricOtherLinesBlurPixels" min="0" max="4" step="0.1" value="0.4" required />
                </div>

                <label class="checkboxContainer">
                    <input is="emby-checkbox" type="checkbox" id="elyricShowSecondLine" checked />
                    <span>显示第二行（常用于注音或翻译）</span>
                </label>

                <label class="checkboxContainer">
                    <input is="emby-checkbox" type="checkbox" id="elyricShowThirdAndLaterLines" checked />
                    <span>显示第三行及更多子行</span>
                </label>

                <h3>用户主题资源存储</h3>
                <div class="fieldDescription">
                    主题数量不设人为上限；以下限制只保护单个文件和服务器磁盘。修改后请重启 Emby 使新限额生效。
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="elyricMaxThemeJsonKilobytes">单个主题 JSON 上限（64–4096 KB）</label>
                    <input is="emby-input" type="number" id="elyricMaxThemeJsonKilobytes" min="64" max="4096" step="1" value="512" required />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="elyricMaxAssetMegabytes">单个图片或字体上限（1–64 MB）</label>
                    <input is="emby-input" type="number" id="elyricMaxAssetMegabytes" min="1" max="64" step="1" value="8" required />
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="elyricUserStorageQuotaMegabytes">每位用户资源配额（32–16384 MB）</label>
                    <input is="emby-input" type="number" id="elyricUserStorageQuotaMegabytes" min="32" max="16384" step="1" value="512" required />
                </div>

                <div class="fieldDescription">
                    保存后，已打开的播放页会在下次进入歌词页面时读取新默认值。首次安装或更新 DLL 后仍需重启 Emby 以加载插件。
                </div>

                <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                    <span id="elyricSubmitLabel">保存</span>
                </button>
            </form>
        </div>
    </div>
</div>
